name: Waffensachkunde Trainer – APK Build

on:
  push:
    branches:
      - claude/waffensachkunde-quiz-app-j5t4br
      - main
    paths:
      - "Waffensachkunde/**"
      - ".github/workflows/waffensachkunde-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Waffensachkunde
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: echo "path=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: waffensachkunde-trainer-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish/update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: waffensachkunde-latest
          name: Waffensachkunde Trainer (aktueller Build)
          body: |
            Automatisch gebauter Debug-APK von `Waffensachkunde Trainer`.

            Installation auf dem Smartphone:
            1. Diese Seite auf dem Smartphone öffnen und die `.apk`-Datei unten herunterladen.
            2. Beim ersten Mal ggf. "Installation aus unbekannten Quellen" für den Browser/Dateimanager erlauben.
            3. Heruntergeladene APK antippen und installieren.

            Dies ist ein Debug-Build zu Testzwecken, kein signierter Play-Store-Release.
          files: ${{ steps.apk.outputs.path }}
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
